// ═══════════════════════════════════════════════
// VAULT CODE ADMIN
// ═══════════════════════════════════════════════
function VaultCodeAdmin(){
  const [code,setCode]=useState("");
  const [currentCode,setCurrentCode]=useState("");
  const [msg,setMsg]=useState("");
  const [err,setErr]=useState("");
  const [loading,setLoading]=useState(true);
  const flash=(m,isErr=false)=>{
    if(isErr)setErr(m);else setMsg(m);
    setTimeout(()=>{setMsg("");setErr("");},3000);
  };
  useEffect(()=>{
    (async()=>{
      setLoading(true);
      try{
        const data=await api("/api/vault-code");
        setCurrentCode(data?.code||"");
      }catch(e){setErr("Failed to load vault code");}
      setLoading(false);
    })();
  },[]);
  const save=async()=>{
    if(!code.trim())return;
    try{
      requireAdmin();
      const data=await api("/api/vault-code","PUT",{code:code.trim().toUpperCase()});
      setCurrentCode(data?.code||"");
      setCode("");
      flash("VAULT CODE UPDATED");
    }catch(e){flash(String(e.message||"SYSTEM ERROR"),true);}
  };
  return(
    <div>
      {msg&&<div style={{color:"#00ff9f",fontFamily:"'Share Tech Mono'",fontSize:12,marginBottom:12,padding:"8px 10px",border:"1px solid #00ff9f33",background:"#00ff9f08",animation:"fadeIn .3s"}}>&gt; {msg}</div>}
      <Err msg={err}/>
      <div style={{...S.panel}} className="terminal-shell">
        <div style={S.hdr}>[ ESCAPE ROOM — VAULT CODE MANAGEMENT ]</div>
        <div style={{fontFamily:"'Share Tech Mono'",color:"#00ff9f66",fontSize:12,lineHeight:1.8,marginBottom:16}}>
          This is the single code teams must enter in the vault to escape the room.<br/>
          Set it here before the event. Teams will not see this code — it must be physically hidden in the vault.
        </div>
        {loading
          ?<div style={{color:"#00ff9f44",fontFamily:"'Share Tech Mono'",fontSize:12}}>LOADING...</div>
          :<>
            <div style={{marginBottom:16,padding:"12px 14px",border:"1px solid #00ff9f33",background:"rgba(0,255,159,.04)",borderRadius:2}}>
              <div style={{fontFamily:"'Share Tech Mono'",fontSize:10,color:"#00ff9f55",letterSpacing:2,marginBottom:4}}>CURRENT VAULT CODE</div>
              <div style={{fontFamily:"Orbitron",fontSize:22,color:"#ffcc00",letterSpacing:6,textShadow:"0 0 16px #ffcc0066"}}>{currentCode||"NOT SET"}</div>
            </div>
            <span style={S.lbl}>SET NEW VAULT CODE</span>
            <div style={{display:"flex",gap:8}}>
              <input
                style={{...S.input,letterSpacing:4,fontSize:15}}
                value={code}
                onChange={e=>setCode(e.target.value.toUpperCase())}
                placeholder="NEW-CODE"
                onKeyDown={e=>e.key==="Enter"&&save()}
              />
              <button style={{...S.btn,flexShrink:0}} onClick={save}>SAVE</button>
            </div>
          </>
        }
      </div>
    </div>
  );
}

// APP ROOT
// â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
function App(){
  const [screen,setScreen]=useState("landing"); // landing | sponsor | auth | game
  const [user,setUser]=useState(null);
  const [intense,setIntense]=useState(false);

  const handleRedPill=()=>{
    setIntense(true);
    setTimeout(()=>setScreen("sponsor"),100);
  };

  const handleSponsorDone=()=>{
    setScreen("auth");
    setIntense(false);
  };

  const login=(u)=>{ACTIVE_USER_ROLE=u?.role||null;setUser(u);setScreen("game")};
  const logout=()=>{ACTIVE_USER_ROLE=null;setUser(null);setScreen("auth")};

  return(
    <>
      <MatrixRain intense={intense||screen==="sponsor"}/>
      <div className="scanline-overlay"/>
      <div className="noise"/>

      {/* LANDING */}
      {screen==="landing"&&(
        <div style={{position:"relative",zIndex:1}}>
          <Landing onRedPill={handleRedPill}/>
        </div>
      )}

      {/* SPONSOR ANIMATION */}
      {screen==="sponsor"&&(
        <SponsorAnimation onComplete={handleSponsorDone}/>
      )}

      {/* AUTH / GAME */}
      {(screen==="auth"||screen==="game")&&(
        <div style={{position:"relative",zIndex:1,minHeight:"100vh"}}>
          {screen==="auth"&&<Login onLogin={login}/>}
          {screen==="game"&&user?.role==="admin"&&<Admin user={user} onLogout={logout}/>}
          {screen==="game"&&user?.role==="team"&&<ClueScreen user={user} onLogout={logout}/>}
          {screen==="game"&&user&&user.role!=="admin"&&user.role!=="team"&&(
            <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
              <div style={{...S.panel,maxWidth:420,width:"100%",textAlign:"center"}}>
                <div style={{fontFamily:"Orbitron",fontSize:14,color:"#ff4444",letterSpacing:2,marginBottom:10}}>INVALID USER ROLE</div>
                <div style={{fontFamily:"'Share Tech Mono'",fontSize:12,color:"#00ff9f99",lineHeight:1.8,marginBottom:16}}>Session data is inconsistent. Please login again.</div>
                <button style={{...S.btn,width:"100%"}} onClick={logout}>RETURN TO LOGIN</button>
              </div>
            </div>
          )}
        </div>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
