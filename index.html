<style>

/* â•â•â• ANIMATIONS â•â•â• */

@keyframes scanline{0%{top:-5%}100%{top:105%}}

@keyframes flicker{0%,100%{opacity:1}92%{opacity:.95}94%{opacity:.6}96%{opacity:.95}98%{opacity:.7}}
@keyframes pulse{0%,100%{box-shadow:0 0 20px #00ff9f33}50%{box-shadow:0 0 40px #00ff9f66}}
@keyframes pulse-glow{0%,100%{box-shadow:0 0 8px #ff003c44}50%{box-shadow:0 0 26px #ff003c88}}
@keyframes pulse-green{0%,100%{box-shadow:0 0 5px var(--mg4)}50%{box-shadow:0 0 20px var(--mg2),0 0 40px var(--mg4)}}

@keyframes intense-flicker{0%,100%{opacity:.28}10%{opacity:.45}20%{opacity:.22}30%{opacity:.48}50%{opacity:.18}70%{opacity:.42}90%{opacity:.25}}
@keyframes error-flash{0%{opacity:0}15%{opacity:.3}100%{opacity:0}}

/* â•â•â• GLOBAL CLASSES â•â•â• */

/* â•â•â• LANDING PAGE â•â•â• */

.matrix-sub{font-size:clamp(12px,2.5vw,18px);letter-spacing:6px;color:var(--mg3);margin:16px 0 40px}

.red-pill-btn:hover{background:rgba(255,0,60,.2)!important;box-shadow:0 0 30px rgba(255,0,60,.4),0 0 60px rgba(255,0,60,.2)}

/* â•â•â• SPONSOR ANIMATION â•â•â• */
.sponsor-stage{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:#000}
.logo-split-wrap{position:relative;width:min(720px,80vw);height:min(420px,45vw);overflow:hidden}
.logo-half{position:absolute;top:0;width:50%;height:100%;overflow:hidden}
.logo-half.left{left:0}
.logo-half.right{right:0}
.logo-glitch{animation:logo-flicker .35s linear 4}
.logo-split-left{animation:split-left 1.2s ease-in-out forwards}

/* â•â•â• QR STYLES â•â•â• */
.qr-shell{position:relative;background:#000;border:1px solid var(--line);padding:10px;display:inline-flex;border-radius:4px;box-shadow:0 0 16px #00ff9f33}
.qr-canvas{line-height:0}
.qr-canvas img,.qr-canvas canvas{display:block}
.qr-logo-wrap{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);padding:4px;background:#fff;border-radius:8px;box-shadow:0 0 10px rgba(255,255,255,.35)}
.qr-logo{display:block;object-fit:contain}

@media(max-width:640px){.red-pill-btn{padding:14px 24px;font-size:14px}}
</style>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
// MOCK DATABASE
// â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
let DB = {
  users: [
    {id:"admin1",team_name:"OPERATOR",password:"zion2077",role:"admin",slot:null},
    {id:"t1",team_name:"TEAM ALPHA",password:"neo1999",role:"team",slot:1},
    {id:"t2",team_name:"TEAM BETA",password:"trinity2",role:"team",slot:2},
    {id:"t3",team_name:"TEAM GAMMA",password:"morpheus3",role:"team",slot:3},
  ],
  clues: [
    {id:"c1-1",team_id:"t1",clue_number:1,clue_text:"The Matrix is everywhere.\nFind the place where students gather for food.\nBehind the green mark lies the fragment.",validation_code:"ALPHA-1",qr_value:"ALPHA-QR-1",next_clue:2},
    {id:"c1-2",team_id:"t1",clue_number:2,clue_text:"Follow the white rabbit.\nWhere knowledge is stored in silence,\nSearch the shelf marked with seven digits.",validation_code:"ALPHA-2",qr_value:"ALPHA-QR-2",next_clue:3},
    {id:"c1-3",team_id:"t1",clue_number:3,clue_text:"There is no spoon.\nThe place where bodies move and sweat,\nNear the locker of the fallen agent.",validation_code:"ALPHA-3",qr_value:"ALPHA-QR-3",next_clue:4},
    {id:"c1-4",team_id:"t1",clue_number:4,clue_text:"Free your mind.\nWhere fire safety meets a red door,\nThe code is painted on the pipe.",validation_code:"ALPHA-4",qr_value:"ALPHA-QR-4",next_clue:5},
    {id:"c1-5",team_id:"t1",clue_number:5,clue_text:"Welcome to the real world.\nAtop the highest accessible floor,\nThe signal node awaits beneath the clock.",validation_code:"ALPHA-5",qr_value:"ALPHA-QR-5",next_clue:null},
    {id:"c2-1",team_id:"t2",clue_number:1,clue_text:"You are the One.\nSeek the place where debates begin,\nUnder the podium of many voices.",validation_code:"BETA-1",qr_value:"BETA-QR-1",next_clue:2},
    {id:"c2-2",team_id:"t2",clue_number:2,clue_text:"The Oracle speaks.\nWhere art meets science on a corridor wall,\nFind the mural that hides the fragment.",validation_code:"BETA-2",qr_value:"BETA-QR-2",next_clue:3},
    {id:"c2-3",team_id:"t2",clue_number:3,clue_text:"Dodge the bullet.\nIn the hall of experiments long past,\nLook for the lab that time forgot.",validation_code:"BETA-3",qr_value:"BETA-QR-3",next_clue:4},
    {id:"c2-4",team_id:"t2",clue_number:4,clue_text:"I know kung fu.\nThe garden between the twin towers,\nHides its secret beneath the iron bench.",validation_code:"BETA-4",qr_value:"BETA-QR-4",next_clue:5},
    {id:"c2-5",team_id:"t2",clue_number:5,clue_text:"Everything that has a beginning has an end.\nWhere machines hum and servers breathe,\nThe datacentre node pulses with the answer.",validation_code:"BETA-5",qr_value:"BETA-QR-5",next_clue:null},
    {id:"c3-1",team_id:"t3",clue_number:1,clue_text:"Unplug yourself.\nThe root of all learning begins here,\nAt the main gate post, eastward facing.",validation_code:"GAMMA-1",qr_value:"GAMMA-QR-1",next_clue:2},
    {id:"c3-2",team_id:"t3",clue_number:2,clue_text:"Coffee fuels the resistance,\nFind the cup that never empties.",validation_code:"GAMMA-2",qr_value:"GAMMA-QR-2",next_clue:3},
    {id:"c3-3",team_id:"t3",clue_number:3,clue_text:"The machines have won, for now.\nWhere students wait for results in dread,\nThe notice board knows more than it shows.",validation_code:"GAMMA-3",qr_value:"GAMMA-QR-3",next_clue:4},
    {id:"c3-4",team_id:"t3",clue_number:4,clue_text:"Sentinels are searching.\nThe amphitheatre of open sky,\nHas a stone engraved with coordinates.",validation_code:"GAMMA-4",qr_value:"GAMMA-QR-4",next_clue:5},
    {id:"c3-5",team_id:"t3",clue_number:5,clue_text:"The prophecy is real.\nBeneath the old building's stairwell,\nA red mark on concrete reveals the truth.",validation_code:"GAMMA-5",qr_value:"GAMMA-QR-5",next_clue:null},
  ],
  team_progress: [
    {team_id:"t1",current_clue:1,clues_completed:0,hunt_start_time:null,hunt_finish_time:null,bonus_ciphers:0},
    {team_id:"t2",current_clue:1,clues_completed:0,hunt_start_time:null,hunt_finish_time:null,bonus_ciphers:0},
    {team_id:"t3",current_clue:1,clues_completed:0,hunt_start_time:null,hunt_finish_time:null,bonus_ciphers:0},
  ],
  escape_queue: [],
};

const toCluePayload=(clue)=>`${String(clue.id||"").toUpperCase()}|${String(clue.validationCode||"").toUpperCase()}`;

const seedCatalog=[];
const seedTeamClues={};
DB.clues.forEach((legacy,i)=>{
  const clueId=`clue_${String(i+1).padStart(3,"0")}`;
  seedCatalog.push({
    id:clueId,
    title:`Node ${legacy.clue_number} - ${legacy.team_id.toUpperCase()}`,
    description:legacy.clue_text,
    validationCode:legacy.validation_code,
    hint:"",
    difficulty:"",
  });
  if(!seedTeamClues[legacy.team_id])seedTeamClues[legacy.team_id]=[];
  seedTeamClues[legacy.team_id].push(clueId);
});
DB.clue_database=seedCatalog;
DB.team_clues=seedTeamClues;

const db = {
  getUser:(tn,pw)=>DB.users.find(u=>u.team_name.toLowerCase()===tn.toLowerCase()&&u.password===pw),
  getProgress:(id)=>DB.team_progress.find(p=>p.team_id===id),
  getClueById:(id)=>DB.clue_database.find(c=>c.id===id),
  getClueDatabase:()=>DB.clue_database,
  getTeamClueIds:(teamId)=>DB.team_clues[teamId]||[],
  getAssignedClues:(teamId)=>db.getTeamClueIds(teamId).map(id=>db.getClueById(id)).filter(Boolean),
  getClue:(teamId,num)=>{
    const assigned=db.getAssignedClues(teamId);
    const idx=Math.max(0,(num||1)-1);
    const clue=assigned[idx];
    if(!clue)return null;
    return{
      ...clue,
      clue_number:idx+1,
      clue_text:clue.description,
      validation_code:clue.validationCode,
      qr_value:toCluePayload(clue),
      next_clue:idx+1<assigned.length?idx+2:null,
    };
  },
  updateProgress:(id,u)=>{const i=DB.team_progress.findIndex(p=>p.team_id===id);if(i>=0)DB.team_progress[i]={...DB.team_progress[i],...u}},
  getAllUsers:()=>DB.users.filter(u=>u.role==="team"),
  getQueue:()=>DB.escape_queue,
  addToQueue:(id)=>{if(!DB.escape_queue.find(q=>q.team_id===id))DB.escape_queue.push({team_id:id,arrival_time:Date.now(),status:"waiting",escape_start_time:null,escape_finish_time:null,hints_used:0,puzzles_solved:[]})},
  updateQueue:(id,u)=>{const i=DB.escape_queue.findIndex(q=>q.team_id===id);if(i>=0)DB.escape_queue[i]={...DB.escape_queue[i],...u}},
  getTeamName:(id)=>DB.users.find(u=>u.id===id)?.team_name||id,
  normalizeTeamProgress:(teamId)=>{
    const p=db.getProgress(teamId);
    if(!p)return;
    const max=db.getAssignedClues(teamId).length;
    const next={
      current_clue:max===0?1:Math.min(Math.max(1,p.current_clue||1),max),
      clues_completed:Math.min(Math.max(0,p.clues_completed||0),max),
    };
    db.updateProgress(teamId,next);
  },
  addClue:(data)=>{
    const next=DB.clue_database.length+1;
    const id=`clue_${String(next).padStart(3,"0")}`;
    const clue={id,title:data.title.trim(),description:data.description.trim(),validationCode:data.validationCode.trim().toUpperCase(),hint:(data.hint||"").trim(),difficulty:(data.difficulty||"").trim()};
    DB.clue_database.push(clue);
    return clue;
  },
  updateClue:(id,updates)=>{
    const i=DB.clue_database.findIndex(c=>c.id===id);
    if(i<0)return null;
    DB.clue_database[i]={...DB.clue_database[i],...updates,validationCode:(updates.validationCode??DB.clue_database[i].validationCode).trim().toUpperCase()};
    return DB.clue_database[i];
  },
  deleteClue:(id)=>{
    DB.clue_database=DB.clue_database.filter(c=>c.id!==id);
    Object.keys(DB.team_clues).forEach(tid=>{
      DB.team_clues[tid]=(DB.team_clues[tid]||[]).filter(cid=>cid!==id);
      db.normalizeTeamProgress(tid);
    });
  },
  assignClue:(teamId,clueId)=>{
    if(!DB.team_clues[teamId])DB.team_clues[teamId]=[];
    if(DB.team_clues[teamId].includes(clueId))return false;
    DB.team_clues[teamId].push(clueId);
    db.normalizeTeamProgress(teamId);
    return true;
  },
  unassignClue:(teamId,clueId)=>{
    if(!DB.team_clues[teamId])return;
    DB.team_clues[teamId]=DB.team_clues[teamId].filter(id=>id!==clueId);
    db.normalizeTeamProgress(teamId);
  },
  addTeam:(data)=>{
    const id="t"+Date.now();
    DB.users.push({id,team_name:data.team_name.toUpperCase(),password:data.password,role:"team",slot:parseInt(data.slot)||null});
    DB.team_progress.push({team_id:id,current_clue:1,clues_completed:0,hunt_start_time:null,hunt_finish_time:null,bonus_ciphers:0});
    DB.team_clues[id]=[];
    return id;
  },
  resetTeam:(id)=>{
    db.updateProgress(id,{current_clue:1,clues_completed:0,hunt_start_time:null,hunt_finish_time:null,bonus_ciphers:0});
    const qi=DB.escape_queue.findIndex(q=>q.team_id===id);if(qi>=0)DB.escape_queue.splice(qi,1);
  },
};

function calcScore(p,q){
  let h=0,e=0;
  if(p?.hunt_finish_time&&p?.hunt_start_time){const el=(p.hunt_finish_time-p.hunt_start_time)/1000;const rem=Math.max(0,55*60-el);h=400+Math.floor(rem/10)*5+(p.bonus_ciphers||0)*50}
  if(q?.escape_finish_time&&q?.escape_start_time){const el=(q.escape_finish_time-q.escape_start_time)/1000;const rem=Math.max(0,5*60-el);e=Math.max(0,500+Math.floor(rem/5)*5-(q.hints_used||0)*30)}
  return{huntScore:h,escapeScore:e,total:h+e};
}

const API_BASE="http://localhost:5000";
let ACTIVE_USER_ROLE=null;
const isAdminSession=()=>ACTIVE_USER_ROLE==="admin";
const requireAdmin=()=>{if(!isAdminSession())throw new Error("ACCESS DENIED");};

async function api(url, method="GET", data=null){
  const options={method,headers:{"Content-Type":"application/json"}};
  if(data)options.body=JSON.stringify(data);
  const res=await fetch(API_BASE+url, options);
  let json={};
  try{json=await res.json();}catch(_){}
  if(!res.ok)throw new Error(json?.error||`SYSTEM ERROR (${res.status})`);
  return json;
}

function applyTeamsFromApi(teams){
  const admin=DB.users.find(u=>u.role==="admin")||{id:"admin1",team_name:"OPERATOR",password:"zion2077",role:"admin",slot:null};
  DB.users=[admin,...(teams||[]).map(t=>({id:t.id,team_name:t.team_name,password:"",role:"team",slot:null}))];
  const teamIds=new Set((teams||[]).map(t=>t.id));
  DB.team_progress=DB.team_progress.filter(p=>teamIds.has(p.team_id));
  for(const t of (teams||[])){
    if(!DB.team_progress.find(p=>p.team_id===t.id)){
      DB.team_progress.push({team_id:t.id,current_clue:1,clues_completed:0,hunt_start_time:null,hunt_finish_time:null,bonus_ciphers:0});
    }
    if(!DB.team_clues[t.id])DB.team_clues[t.id]=[];
  }
}

function applyCluesFromApi(clues){
  DB.clue_database=(clues||[]).map(c=>({
    id:c.id,title:c.title,description:c.description,validationCode:c.validationCode,hint:c.hint||"",difficulty:c.difficulty||""
  }));
}

async function refreshTeamsFromApi(){
  const out=await api("/api/teams");
  applyTeamsFromApi(out.teams||[]);
  return DB.users.filter(u=>u.role==="team");
}

async function refreshCluesFromApi(){
  const out=await api("/api/clues");
  applyCluesFromApi(out.clues||[]);
  return DB.clue_database;
}

async function refreshAssignmentFromApi(teamId){
  if(!teamId)return [];
  const out=await api(`/api/assignment/${teamId}`);
  const clues=(out.clues||[]).map(c=>({
    id:c.id,title:c.title,description:c.description,validationCode:c.validationCode,hint:c.hint||"",difficulty:c.difficulty||""
  }));
  DB.team_clues[teamId]=clues.map(c=>c.id);
  db.normalizeTeamProgress(teamId);
  return clues;
}

async function refreshProgressFromApi(){
  const out=await api("/api/progress");

// â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
function MatrixRain({intense=false}){
  const ref=useRef(null);
  useEffect(()=>{
    const c=ref.current;if(!c)return;
    const ctx=c.getContext("2d");
    const resize=()=>{c.width=window.innerWidth;c.height=window.innerHeight};
    resize();
    const chars="ã‚¢ã‚¤ã‚¦ã‚¨ã‚ªã‚«ã‚­ã‚¯ã‚±ã‚³ã‚µã‚·ã‚¹ã‚»ã‚½ã‚¿ãƒãƒ„ãƒ†ãƒˆãƒŠãƒ‹ãƒŒãƒãƒŽ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ@#$%&";
    const fs=14,cols=Math.floor(c.width/fs);
    const drops=Array(cols).fill(1);
    let af;
    const draw=()=>{
      ctx.fillStyle=intense?"rgba(0,0,0,0.022)":"rgba(0,0,0,0.034)";
      ctx.fillRect(0,0,c.width,c.height);
      ctx.font=fs+"px 'Share Tech Mono',monospace";
      for(let i=0;i<drops.length;i++){
        const ch=chars[Math.floor(Math.random()*chars.length)];
        ctx.fillStyle=Math.random()>.97?"#ffffff":"#00ff9f";
        ctx.globalAlpha=Math.random()*.5+.2;
        ctx.fillText(ch,i*fs,drops[i]*fs);
        ctx.globalAlpha=1;
        if(drops[i]*fs>c.height&&Math.random()>.987)drops[i]=0;
        drops[i]+=intense?.42:.3;
      }
      af=requestAnimationFrame(draw);
    };
    draw();
    window.addEventListener("resize",resize);
    return()=>{cancelAnimationFrame(af);window.removeEventListener("resize",resize)};
  },[intense]);
  return <canvas ref={ref} style={{position:"fixed",top:0,left:0,zIndex:0,opacity:intense?.25:.15,pointerEvents:"none",transition:"opacity 0.5s"}}/>;
}

function QRDisplay({value, logoSrc, size=160}){
  const qrRef=useRef(null);
  const [ready,setReady]=useState(false);
  useEffect(()=>{
    if(!qrRef.current||!value||typeof QRCode==="undefined"){setReady(false);return;}
    setReady(false);
    qrRef.current.innerHTML="";
    new QRCode(qrRef.current,{
      text:value,
      width:size,
      height:size,
      colorDark:"#00ff9f",
      colorLight:"#000000",
      correctLevel:QRCode.CorrectLevel.H
    });
    const t=setTimeout(()=>setReady(true),30);
    return()=>clearTimeout(t);
  },[value,size]);
  if(typeof QRCode==="undefined"){
    return <div style={{width:size,height:size,border:"1px solid #00ff9f33",display:"flex",alignItems:"center",justifyContent:"center",color:"#00ff9f44",fontSize:11}}>QR LIBRARY MISSING</div>;
  }
  return(
    <div className="qr-shell">
      <div ref={qrRef} className="qr-canvas" style={{width:size,height:size}}/>
      {!ready&&<div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",color:"#00ff9f44",fontSize:11,background:"rgba(0,0,0,.28)"}}>GENERATING...</div>}
      {logoSrc&&ready&&(
        <div className="qr-logo-wrap">
          <img src={logoSrc} alt="Sponsor logo" className="qr-logo" style={{width:Math.round(size*0.22),height:Math.round(size*0.22)}}/>
        </div>
      )}
    </div>
  );
}

function generateQRDataUrl(value,size=240,logoSrc="photos/logo.png"){
  return new Promise((resolve)=>{
    if(typeof QRCode==="undefined"||!value){resolve(null);return;}
    const mount=document.createElement("div");
    mount.style.position="fixed";
    mount.style.left="-9999px";
    mount.style.top="-9999px";
    document.body.appendChild(mount);
    new QRCode(mount,{
      text:value,
      width:size,
      height:size,
      colorDark:"#00ff9f",
      colorLight:"#000000",
      correctLevel:QRCode.CorrectLevel.H
    });
    setTimeout(()=>{
      const src=mount.querySelector("img")?.src||(mount.querySelector("canvas")?mount.querySelector("canvas").toDataURL("image/png"):null);
      document.body.removeChild(mount);
      if(!src||!logoSrc){resolve(src);return;}
      const qrImg=new Image();
      qrImg.onload=()=>{
        const canvas=document.createElement("canvas");
        canvas.width=size;canvas.height=size;
        const ctx=canvas.getContext("2d");
        ctx.drawImage(qrImg,0,0,size,size);
        const logo=new Image();
        logo.onload=()=>{
          const lSize=Math.round(size*0.22);
          const p=Math.max(4,Math.round(size*0.02));
          const x=Math.round((size-lSize)/2);
          const y=Math.round((size-lSize)/2);
          ctx.fillStyle="#ffffff";
          ctx.fillRect(x-p,y-p,lSize+p*2,lSize+p*2);
          ctx.drawImage(logo,x,y,lSize,lSize);
          resolve(canvas.toDataURL("image/png"));
        };
        logo.onerror=()=>resolve(canvas.toDataURL("image/png"));
        logo.src=logoSrc;
      };
      qrImg.onerror=()=>resolve(src);
      qrImg.src=src;
    },70);
  });
}

function TerminalLoader({lines,onComplete,color="#00ff9f"}){
  const [shown,setShown]=useState([]);
  const [active,setActive]=useState(0);
  useEffect(()=>{
    if(active>=lines.length){const t=setTimeout(onComplete,500);return()=>clearTimeout(t)}
    const t=setTimeout(()=>{setShown(p=>[...p,lines[active]]);setActive(a=>a+1)},450+Math.random()*300);
    return()=>clearTimeout(t);
  },[active,lines.length]);
  return(
    <div style={{fontFamily:"'Share Tech Mono',monospace",color,fontSize:13,lineHeight:2}}>
      {shown.map((l,i)=>(
        <div key={i} style={{opacity:i<shown.length-1?.65:1,transition:"opacity .3s"}}>
          <span style={{color:"#00ccff"}}>&gt;</span> {l}
          {i===shown.length-1&&<span className="blink"> _</span>}
        </div>
      ))}
    </div>
  );
}

// TIMER (55min hunt / 5min escape)
// â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
function Timer({startTime,duration,onExpire,label="SYSTEM REBOOT IN"}){
  const [rem,setRem]=useState(duration);
  const firedRef=useRef(false);
  useEffect(()=>{
    const tick=()=>{
      const el=startTime?(Date.now()-startTime)/1000:0;
      const r=Math.max(0,duration-el);
      setRem(r);
      if(r<=0&&onExpire&&!firedRef.current){firedRef.current=true;onExpire();}
    };
    tick();
    const iv=setInterval(tick,1000);
    return()=>clearInterval(iv);
  },[startTime,duration]);
  const m=String(Math.floor(rem/60)).padStart(2,"0"),s=String(Math.floor(rem%60)).padStart(2,"0");
  const urgent=rem<120,pct=(rem/duration)*100;
  return(
    <div style={{textAlign:"center",marginBottom:20}}>
      <div style={{fontSize:10,color:"#00ccff",letterSpacing:4,fontFamily:"Orbitron",marginBottom:4}}>{label}</div>
      <div style={{fontSize:40,fontFamily:"Orbitron",color:urgent?"#ff4444":"#00ff9f",textShadow:`0 0 24px ${urgent?"#ff4444":"#00ff9f"}`,letterSpacing:8,transition:"color .5s"}}>{m}:{s}</div>
      <div style={{width:"100%",height:3,background:"#111",marginTop:8,borderRadius:2,overflow:"hidden"}}>
        <div style={{height:"100%",width:pct+"%",background:urgent?"#ff4444":"#00ff9f",transition:"width 1s linear,background .5s"}}/>
      </div>
    </div>
  );
}

// CLUE SCREEN (Team view)
// â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
function ClueScreen({user,onLogout}){
  const [phase,setPhase]=useState("boot");
  const [bootLines,setBootLines]=useState([]);
  const [clue,setClue]=useState(null);
  const [code,setCode]=useState("");
  const [codeErr,setCodeErr]=useState("");
  const [showQR,setShowQR]=useState(false);
  const [successLines,setSuccessLines]=useState([]);
  const [queueEntry,setQueueEntry]=useState(null);
  const [huntExpired,setHuntExpired]=useState(false);

  const progress=()=>db.getProgress(user.id);

  const loadClue=async(num)=>{
    const total=db.getAssignedClues(user.id).length;
    const c=db.getClue(user.id,num);
    setClue(c);setCode("");setCodeErr("");
    setBootLines(["CONNECTING TO SOURCE NODE...","DECRYPTING LOCATION DATA...","SIGNAL DETECTED...",`LOADING CLUE ${num} OF ${total||0}...`]);
    setPhase("boot");
  };

  useEffect(()=>{
    (async()=>{
      try{
        await refreshAssignmentFromApi(user.id);
        await refreshProgressFromApi();
      }catch(_){}
      const p=progress();
      if(!p.hunt_start_time)db.updateProgress(user.id,{hunt_start_time:Date.now()});
      loadClue(progress().current_clue);
    })();
  },[]);

  useEffect(()=>{
    const iv=setInterval(()=>{
      const q=db.getQueue().find(q=>q.team_id===user.id);
      if(q){setQueueEntry({...q});if(q.status==="active"&&phase==="escape-queue")setPhase("escape");if(q.status==="finished"&&phase!=="victory")setPhase("victory");}
    },2000);
    return()=>clearInterval(iv);
  },[phase]);

  const verify=async(val)=>{
    if(!clue)return;
    if(huntExpired){setCodeErr("TIME EXPIRED â€” ACCESS TERMINATED");return;}
    const v=val.trim().toUpperCase();
    let valid=false;
    try{
      const data=await apiSvc.validateCode(user.id,v);
      valid=!!data?.valid;
      if(valid){
        if(data?.currentClue)db.updateProgress(user.id,{current_clue:data.currentClue});
        if(typeof data?.completed==="number")db.updateProgress(user.id,{clues_completed:data.completed});
      }
    }catch(_){}
    if(!valid)valid=v===clue.validation_code.toUpperCase()||v===clue.qr_value.toUpperCase();
    if(valid){
      const isLast=clue.next_clue===null;
      const p=progress();
      const updates={clues_completed:p.clues_completed+1};
      if(!isLast)updates.current_clue=clue.next_clue;
      else updates.hunt_finish_time=Date.now();
      db.updateProgress(user.id,updates);
      if(isLast)db.addToQueue(user.id);
      setSuccessLines(isLast
        ?["CODE VERIFIED","FRAGMENT ACQUIRED","SOURCE SIGNAL FOUND","MORPHEUS LOCATION IDENTIFIED","ESCAPE ROOM ACCESS UNLOCKED"]
        :["CODE VERIFIED","FRAGMENT ACQUIRED","DATABASE UPDATED","NEXT NODE UNLOCKED"]);
      setPhase("success");
    }else{setCodeErr("INVALID CODE â€” FRAGMENT REJECTED");}
  };

  const p=progress();
  const assignedTotal=db.getAssignedClues(user.id).length;

  if(showQR)return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{maxWidth:460,width:"100%"}}>
        <QRScanner onScan={v=>{setShowQR(false);verify(v)}} onClose={()=>setShowQR(false)}/>
      </div>
    </div>
  );

  const Header=()=>(
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:20,paddingBottom:12,borderBottom:"1px solid #00ff9f1a"}}>
      <div>
        <div style={{fontFamily:"Orbitron",fontSize:9,color:"#00ccff",letterSpacing:3}}>OPERATIVE</div>
        <div style={{fontFamily:"Orbitron",fontSize:15,color:"#00ff9f",textShadow:"0 0 10px #00ff9f55"}}>{user.team_name}</div>
      </div>
      <div style={{textAlign:"right"}}>
        <div style={{fontFamily:"'Share Tech Mono'",fontSize:10,color:"#00ff9f66"}}>FRAGMENTS: {p.clues_completed}/{assignedTotal||0}</div>
        <button style={{...S.btn,fontSize:9,padding:"3px 8px",marginTop:4}} onClick={onLogout}>LOGOUT</button>
      </div>
    </div>
  );

  if(phase==="expired"||huntExpired&&phase!=="success"&&phase!=="escape-queue"&&phase!=="escape"&&phase!=="victory")return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{maxWidth:460,width:"100%",textAlign:"center"}}>
        <div style={{fontFamily:"Orbitron",fontSize:36,color:"#ff4444",textShadow:"0 0 30px #ff4444",marginBottom:12,animation:"glitch-full .5s infinite"}}>SYSTEM LOCKDOWN</div>
        <div style={{fontFamily:"'Share Tech Mono'",color:"#ff4444",fontSize:14,letterSpacing:2,marginBottom:8}}>TIME EXPIRED â€” ACCESS TERMINATED</div>
        <div style={{fontFamily:"'Share Tech Mono'",color:"#ff444466",fontSize:12,marginBottom:32}}>SIMULATION TERMINATED</div>
        <button style={{...S.btn,borderColor:"#ff4444",color:"#ff4444"}} onClick={onLogout}>DISCONNECT</button>
      </div>
    </div>
  );

  if(phase==="victory"){
    const q=db.getQueue().find(q=>q.team_id===user.id);
    const sc=calcScore(p,q);
    return(
      <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
        <div style={{maxWidth:460,width:"100%"}}>
          <div style={{...S.panel,textAlign:"center"}}>
            <GlitchText text="MISSION COMPLETE" size={24}/>
            <div style={{fontFamily:"'Share Tech Mono'",color:"#00ff9f77",fontSize:12,margin:"16px 0 20px",lineHeight:1.8}}>The Matrix has been unplugged.<br/>Well done, {user.team_name}.</div>
            <ScRow lbl="HUNT SCORE" val={sc.huntScore}/>
            <ScRow lbl="ESCAPE SCORE" val={sc.escapeScore}/>
            <div style={{borderTop:"1px solid #00ff9f22",margin:"10px 0"}}/>
            <ScRow lbl="TOTAL SCORE" val={sc.total} hi/>
            <button style={{...S.btn,marginTop:20,width:"100%"}} onClick={onLogout}>DISCONNECT</button>
          </div>
        </div>
      </div>
    );
  }

  return(
    <div style={{minHeight:"100vh",padding:"16px"}}>
      <div style={{maxWidth:460,margin:"0 auto"}}>
        <Header/>
        {p.hunt_start_time&&!p.hunt_finish_time&&(
          <Timer startTime={p.hunt_start_time} duration={55*60} label="HUNT TIMER" onExpire={()=>setHuntExpired(true)}/>
        )}

        {huntExpired&&phase==="clue"&&(
          <div style={{...S.panel,textAlign:"center",borderColor:"#ff444444"}}>
            <div style={{color:"#ff4444",fontFamily:"Orbitron",fontSize:14,letterSpacing:2,animation:"glitch-full .5s infinite"}}>TIME EXPIRED â€” ACCESS TERMINATED</div>
          </div>
        )}

        {phase==="boot"&&(
          <div style={{...S.panel,}} className="terminal-shell">
            <TerminalLoader lines={bootLines} onComplete={()=>setPhase("clue")}/>
          </div>
        )}

        {phase==="clue"&&clue&&(
          <div style={S.panel} className="active-panel terminal-shell">
            <div style={S.hdr}>[ NODE {clue.clue_number} OF {assignedTotal||0} â€” DECRYPTED ]</div>
            <div style={{fontFamily:"'Share Tech Mono'",color:"#00ff9f",fontSize:14,lineHeight:1.9,whiteSpace:"pre-line",padding:"12px 14px",border:"1px solid #00ff9f1a",background:"rgba(0,255,159,.025)",marginBottom:20,borderRadius:2}}>
              {clue.clue_text}
            </div>
            <span style={S.lbl}>ENTER FRAGMENT CODE:</span>
            <input style={{...S.input,marginBottom:0}} value={code} onChange={e=>{setCode(e.target.value.toUpperCase());setCodeErr("")}} placeholder="XXXX-XX" onKeyDown={e=>e.key==="Enter"&&!huntExpired&&verify(code)} disabled={huntExpired}/>
            <Err msg={codeErr}/>
            <div style={{display:"flex",gap:8,marginTop:12}}>
              <button style={{...S.btn,flex:1}} onClick={()=>!huntExpired&&verify(code)} disabled={huntExpired}>VERIFY CODE</button>
              <button style={{...S.btn,flex:1,borderColor:"#00ccff",color:"#00ccff"}} onClick={()=>!huntExpired&&setShowQR(true)} disabled={huntExpired}>SCAN QR</button>
            </div>
          </div>
        )}

        {phase==="clue"&&!clue&&(
          <div style={S.panel} className="terminal-shell">
            <div style={{fontFamily:"Orbitron",fontSize:13,color:"#00ccff",letterSpacing:2,marginBottom:8}}>NO ASSIGNED CLUES</div>
            <div style={{fontFamily:"'Share Tech Mono'",fontSize:12,color:"#00ff9f66",lineHeight:1.8}}>Ask OPERATOR to assign clues in ADMIN &gt; MANAGE.</div>
          </div>
        )}

        {phase==="success"&&(
          <div style={{...S.panel,}} className="terminal-shell">
            <TerminalLoader lines={successLines} color="#00ff9f" onComplete={()=>{
              const up=progress();
              if(up.hunt_finish_time)setPhase("escape-queue");
              else loadClue(up.current_clue);
            }}/>
          </div>
        )}

        {phase==="escape-queue"&&(
          <div style={{...S.panel,textAlign:"center",animation:"pulse 2s infinite"}} className="terminal-shell">
            <div style={{fontFamily:"Orbitron",fontSize:20,color:"#00ff9f",marginBottom:14,textShadow:"0 0 20px #00ff9f"}}>ESCAPE ROOM UNLOCKED</div>
            <div style={{fontFamily:"'Share Tech Mono'",color:"#00ccff",fontSize:13,lineHeight:2}}>
              Proceed to the escape room.<br/>
              Wait for the OPERATOR to call your team.<br/><br/>
              <span className="blink">â– </span> STATUS: QUEUED â€” STANDBY
            </div>
          </div>
        )}

        {phase==="escape"&&queueEntry&&(
          <EscapeTeamView user={user} entry={queueEntry} onVictory={()=>setPhase("victory")}/>
        )}
      </div>
    </div>
  );
}

function EscapeTeamView({user,entry,onVictory}){
  const [e,setE]=useState(entry);
  const [code,setCode]=useState("");
  const [codeErr,setCodeErr]=useState("");
  const FINAL="ORAC-LEVL-ZION-NEOS";
  const PUZZLES=["Puzzle A1 â€” Cipher Lock","Puzzle A2 â€” Wiring Sequence","Puzzle A3 â€” Mirror Code","Puzzle A4 â€” Final Override"];
  useEffect(()=>{
    const iv=setInterval(()=>{const q=db.getQueue().find(q=>q.team_id===user.id);if(q)setE({...q});},2000);
    return()=>clearInterval(iv);
  },[user.id]);
  const submit=()=>{
    if(code.trim().toUpperCase()===FINAL){
      db.updateQueue(user.id,{status:"finished",escape_finish_time:Date.now()});
      onVictory();
    }else setCodeErr("OVERRIDE REJECTED â€” INVALID SEQUENCE");
  };
  return(
    <div>
      {e.escape_start_time&&<Timer startTime={e.escape_start_time} duration={5*60} label="ESCAPE TIMER" onExpire={()=>{}}/>}
      <div style={{...S.panel,}} className="terminal-shell">
        <div style={S.hdr}>[ ESCAPE SEQUENCE â€” PUZZLE TRACKER ]</div>
        {PUZZLES.map((p,i)=>{const done=(e.puzzles_solved||[]).includes(i);return(
          <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"7px 0",borderBottom:"1px solid #00ff9f0d"}}>
            <div style={{width:16,height:16,border:`1px solid ${done?"#00ff9f":"#00ff9f33"}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,color:"#00ff9f",flexShrink:0,transition:"all .3s"}}>{done?"âœ“":""}</div>
            <span style={{fontFamily:"'Share Tech Mono'",fontSize:12,color:done?"#00ff9f":"#00ff9f66",transition:"color .3s"}}>{p}</span>
          </div>
        );})}
      </div>
      <div style={{...S.panel,}} className="terminal-shell">
        <div style={S.hdr}>[ FINAL OVERRIDE SEQUENCE ]</div>
        <span style={S.lbl}>ENTER OVERRIDE CODE:</span>
        <input style={S.input} value={code} onChange={e=>{setCode(e.target.value.toUpperCase());setCodeErr("")}} placeholder="XXXX-XXXX-XXXX-XXXX" onKeyDown={e=>e.key==="Enter"&&submit()}/>
        <Err msg={codeErr}/>
        <button style={{...S.btn,width:"100%",marginTop:12}} onClick={submit}>SUBMIT OVERRIDE</button>
      </div>
    </div>
  );
}

                {!active&&!done&&<button style={S.btn} onClick={()=>start(entry.team_id)}>â–¶ START</button>}

function Board(){
  const [,tick]=useState(0);
  useEffect(()=>{
    const pull=async()=>{
      try{
        const teams=await refreshTeamsFromApi();
        await Promise.all(teams.map(t=>refreshAssignmentFromApi(t.id)));
        await refreshProgressFromApi();
      }catch(_){}
      tick(t=>t+1);
    };
    pull();
    const iv=setInterval(pull,5000);
    return()=>clearInterval(iv);
  },[]);
  const teams=db.getAllUsers();
  const rows=teams.map(u=>{
    const p=db.getProgress(u.id);
    const q=db.getQueue().find(q=>q.team_id===u.id);
    const sc=calcScore(p,q);
    const tt=p?.hunt_finish_time&&p?.hunt_start_time?Math.floor((p.hunt_finish_time-p.hunt_start_time)/1000)+(q?.escape_finish_time&&q?.escape_start_time?Math.floor((q.escape_finish_time-q.escape_start_time)/1000):0):null;
    return{...u,p,q,sc,tt};
  }).sort((a,b)=>b.sc.total-a.sc.total);
  const ft=s=>s!==null?Math.floor(s/60)+"m "+(s%60)+"s":"â€”";
  return(
    <div style={{...S.panel,}} className="terminal-shell">
      <div style={S.hdr}>[ LEADERBOARD â€” OPERATOR EYES ONLY ]</div>
      <div style={{overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontFamily:"'Share Tech Mono'",fontSize:12,minWidth:580}}>
          <thead><tr>{["#","TEAM","CLUES","HUNT","ESCAPE","TOTAL","TIME"].map(h=><th key={h} style={{padding:"8px 10px",borderBottom:"1px solid #00ff9f22",color:"#00ccff",textAlign:"left",fontFamily:"Orbitron",fontSize:9}}>{h}</th>)}</tr></thead>
          <tbody>
            {rows.map((r,i)=>(
              <tr key={r.id} style={{borderBottom:"1px solid #00ff9f0a",background:i===0?"rgba(0,255,159,0.04)":"transparent"}}>
                <td style={{padding:"8px 10px",color:i===0?"#ffcc00":"#00ff9f55",fontFamily:"Orbitron",fontWeight:i===0?"bold":"normal"}}>#{i+1}</td>
                <td style={{padding:"8px 10px",color:"#00ff9f",fontFamily:"Orbitron",fontSize:10}}>{r.team_name}</td>
                <td style={{padding:"8px 10px"}}>{r.p?.clues_completed||0}/{db.getAssignedClues(r.id).length}</td>
                <td style={{padding:"8px 10px",color:"#00ff9f"}}>{r.sc.huntScore}</td>
                <td style={{padding:"8px 10px",color:"#00ccff"}}>{r.sc.escapeScore}</td>
                <td style={{padding:"8px 10px",fontFamily:"Orbitron",fontSize:i===0?16:13,color:i===0?"#ffcc00":"#00ff9f"}}>{r.sc.total}</td>
                <td style={{padding:"8px 10px",color:"#00ff9f44"}}>{ft(r.tt)}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function Manage(){

  const [newClueId,setNewClueId]=useState("");
  const [msg,setMsg]=useState("");
  const [err,setErr]=useState("");
  const [,tick]=useState(0);
  const flash=(m)=>{setMsg(m);setTimeout(()=>setMsg(""),2500)};
  const allClues=db.getClueDatabase();
  const assigned=selectedTeam?db.getAssignedClues(selectedTeam):[];

  useEffect(()=>{
    (async()=>{
      try{
        await refreshTeamsFromApi();
        await refreshCluesFromApi();
        await refreshProgressFromApi();
        const list=db.getAllUsers();
        setTeams(list);
        if(!selectedTeam&&list[0]?.id)setSelectedTeam(list[0].id);
        setErr("");
      }catch(e){setErr(String(e.message||"SYSTEM ERROR"));} 
      tick(t=>t+1);
    })();
  },[]);

    if(!selectedTeam&&teams[0]?.id)setSelectedTeam(teams[0].id);
    if(selectedTeam&&!teams.find(t=>t.id===selectedTeam))setSelectedTeam(teams[0]?.id||"");

  useEffect(()=>{
    if(!selectedTeam)return;
    (async()=>{
      try{
        await refreshAssignmentFromApi(selectedTeam);
        await refreshProgressFromApi();
        setErr("");
      }catch(e){setErr(String(e.message||"SYSTEM ERROR"));}
      tick(t=>t+1);
    })();
  },[selectedTeam]);

  const addTeam=async()=>{
    if(!nt.team_name||!nt.password)return;
    try{
      requireAdmin();

      const list=db.getAllUsers();
      setTeams(list);
      setNt({team_name:"",password:"",slot:""});

      setSelectedTeam(out?.team?.id||list[0]?.id||"");
      setErr("");
      tick(t=>t+1);

    if(!selectedTeam||!newClueId)return;

      requireAdmin();

      await refreshAssignmentFromApi(selectedTeam);
      await refreshProgressFromApi();
      flash("CLUE ASSIGNED");
      setNewClueId("");
      setErr("");
      tick(t=>t+1);
    }catch(e){setErr(String(e.message||"SYSTEM ERROR"));}
  };

  const removeClue=async(clueId)=>{
    if(!selectedTeam)return;
    try{
      requireAdmin();
      await api("/api/remove-clue","POST",{teamId:selectedTeam,clueId});
      await refreshAssignmentFromApi(selectedTeam);
      await refreshProgressFromApi();

    <div>

          <input style={S.input} placeholder="PASSWORD" value={nt.password} onChange={e=>setNt(p=>({...p,password:e.target.value}))}/>

function CluesPage(){
  const [form,setForm]=useState({title:"",description:"",validationCode:"",hint:"",difficulty:""});
  const [editingId,setEditingId]=useState(null);
  const [msg,setMsg]=useState("");
  const [err,setErr]=useState("");
  const [clues,setClues]=useState([]);
  const [,tick]=useState(0);
  const flash=(m)=>{setMsg(m);setTimeout(()=>setMsg(""),2500)};
  const payloadFor=(clue)=>toCluePayload(clue);

  useEffect(()=>{
    (async()=>{
      try{
        const list=await refreshCluesFromApi();
        setClues([...list]);
        setErr("");
      }catch(e){setErr(String(e.message||"SYSTEM ERROR"));}
    })();
  },[]);

  const submit=async()=>{
    if(!form.title.trim()||!form.description.trim()||!form.validationCode.trim()){flash("TITLE / DESCRIPTION / VALIDATION CODE REQUIRED");return;}
    try{
      requireAdmin();
      if(editingId){
        await api(`/api/clue/${editingId}`,"PUT",{title:form.title,description:form.description,validationCode:form.validationCode,hint:form.hint,difficulty:form.difficulty});
        flash("CLUE UPDATED");

        await api("/api/clue","POST",{title:form.title,description:form.description,validationCode:form.validationCode,hint:form.hint,difficulty:form.difficulty});
        flash("CLUE ADDED");
      }
      const list=await refreshCluesFromApi();
      setClues([...list]);
      setErr("");
      await refreshProgressFromApi();
      tick(t=>t+1);
    }catch(e){setErr(String(e.message||"SYSTEM ERROR")); return;}
    setForm({title:"",description:"",validationCode:"",hint:"",difficulty:""});
    setEditingId(null);
  };

  const startEdit=(clue)=>{
    setEditingId(clue.id);
    setForm({title:clue.title,description:clue.description,validationCode:clue.validationCode,hint:clue.hint||"",difficulty:clue.difficulty||""});
  };

  const remove=async(clue)=>{
    try{
      requireAdmin();
      await api(`/api/clue/${clue.id}`,"DELETE");

      setClues([...list]);
      const teams=await refreshTeamsFromApi();
      await Promise.all(teams.map(t=>refreshAssignmentFromApi(t.id)));
      await refreshProgressFromApi();
      flash("CLUE DELETED");
      setErr("");
      if(editingId===clue.id){setEditingId(null);setForm({title:"",description:"",validationCode:"",hint:"",difficulty:""});}
      tick(t=>t+1);
    }catch(e){setErr(String(e.message||"SYSTEM ERROR"));}
  };

  const downloadQR=async(clue)=>{
    const src=await generateQRDataUrl(payloadFor(clue),240,"photos/logo.png");
    if(!src)return;
    const a=document.createElement("a");
    a.href=src;
    a.download=`QR_${payloadFor(clue)}.png`;
    a.click();
  };

  return(
    <div>
      {msg&&<div style={{color:"#00ff9f",fontFamily:"'Share Tech Mono'",fontSize:12,marginBottom:12,padding:"8px 10px",border:"1px solid #00ff9f33",background:"#00ff9f08",animation:"fadeIn .3s"}}>&gt; {msg}</div>}
      <Err msg={err}/>
      <div style={{...S.panel}} className="terminal-shell">
        <div style={S.hdr}>[ CLUE DATABASE ]</div>
        <span style={S.lbl}>CLUE TITLE</span>
        <input style={{...S.input,marginBottom:8}} value={form.title} onChange={e=>setForm(p=>({...p,title:e.target.value}))}/>
        <span style={S.lbl}>CLUE DESCRIPTION</span>
        <textarea rows={4} value={form.description} onChange={e=>setForm(p=>({...p,description:e.target.value}))}/>
        <div style={{height:8}}/>
        <span style={S.lbl}>VALIDATION CODE</span>
        <input style={{...S.input,marginBottom:8}} value={form.validationCode} onChange={e=>setForm(p=>({...p,validationCode:e.target.value.toUpperCase()}))}/>
        <span style={S.lbl}>HINT</span>
        <textarea rows={3} value={form.hint} onChange={e=>setForm(p=>({...p,hint:e.target.value}))}/>
        <div style={{height:8}}/>
        <span style={S.lbl}>DIFFICULTY (OPTIONAL)</span>
        <input style={{...S.input,marginBottom:12}} value={form.difficulty} onChange={e=>setForm(p=>({...p,difficulty:e.target.value}))}/>
        <button style={S.btn} onClick={submit}>{editingId?"UPDATE CLUE":"ADD CLUE"}</button>
      </div>

      <div style={{...S.panel}} className="terminal-shell">
        <div style={S.hdr}>[ CLUE LIST ]</div>
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontFamily:"'Share Tech Mono'",fontSize:12,minWidth:760}}>
            <thead><tr>{["TITLE","CODE","QR","ACTIONS"].map(h=><th key={h} style={{padding:"8px 10px",borderBottom:"1px solid #00ff9f22",color:"#00ccff",textAlign:"left",fontFamily:"Orbitron",fontSize:9,letterSpacing:1}}>{h}</th>)}</tr></thead>
            <tbody>
              {clues.map(c=>(
                <tr key={c.id} style={{borderBottom:"1px solid #00ff9f0a"}}>
                  <td style={{padding:"8px 10px"}}>
                    <div style={{fontFamily:"Orbitron",fontSize:11,color:"#00ff9f"}}>{c.title}</div>
                    <div style={{fontSize:10,color:"#00ff9f55"}}>{c.id}</div>
                  </td>
                  <td style={{padding:"8px 10px",color:"#00ccff"}}>{c.validationCode}</td>
                  <td style={{padding:"8px 10px"}}><QRDisplay value={payloadFor(c)} logoSrc="photos/logo.png" size={86}/></td>
                  <td style={{padding:"8px 10px"}}>
                    <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                      <button style={{...S.btn,fontSize:9,padding:"3px 8px"}} onClick={()=>startEdit(c)}>EDIT</button>
                      <button style={{...S.btn,fontSize:9,padding:"3px 8px",borderColor:"#ff4444",color:"#ff4444"}} onClick={()=>remove(c)}>DELETE</button>
                      <button style={{...S.btn,fontSize:9,padding:"3px 8px",borderColor:"#00ccff",color:"#00ccff"}} onClick={()=>downloadQR(c)}>DOWNLOAD QR</button>
                    </div>

              ))}
              {clues.length===0&&<tr><td colSpan={4} style={{padding:"18px 10px",color:"#00ff9f44",textAlign:"center"}}>NO CLUES IN DATABASE.</td></tr>}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

function QRCard({clue,index,onDownload,onPrint}){
  const [qrSrc,setQrSrc]=useState(null);
  const [payload,setPayload]=useState(toCluePayload(clue));
  useEffect(()=>{
    let active=true;
    (async()=>{
      let value=toCluePayload(clue);
      try{
        const data=await apiSvc.getQRData(clue.team_id||null,index);
        if(data?.payload)value=data.payload;
      }catch(_){}
      if(!active)return;
      setPayload(value);
      const src=await generateQRDataUrl(value,200,"photos/logo.png");
      if(active)setQrSrc(src);
    })();
    return()=>{active=false;};
  },[clue.id,clue.validationCode,index]);

  return(
    <div style={{...S.panel,textAlign:"center"}} className="terminal-shell">
      <div style={{fontFamily:"Orbitron",fontSize:10,color:"#00ccff",letterSpacing:2,marginBottom:8}}>CLUE {index}</div>
      <div style={{fontFamily:"'Share Tech Mono'",fontSize:11,color:"#00ff9f",marginBottom:12,letterSpacing:1}}>{payload}</div>
      <div style={{display:"flex",justifyContent:"center",marginBottom:12}}>
        <QRDisplay value={payload} logoSrc="photos/logo.png" size={160}/>
      </div>
      <div style={{fontFamily:"'Share Tech Mono'",fontSize:9,color:"#00ff9f33",marginBottom:10,lineHeight:1.5}}>VALIDATION: {clue.validationCode}</div>
      <div style={{display:"flex",gap:6,justifyContent:"center"}}>
        <button style={{...S.btn,fontSize:9,padding:"4px 10px"}} onClick={()=>qrSrc&&onDownload(qrSrc,`QR_${payload}.png`)}>â¬‡ DL</button>
        <button style={{...S.btn,fontSize:9,padding:"4px 10px",borderColor:"#00ccff",color:"#00ccff"}} onClick={()=>qrSrc&&onPrint(qrSrc,payload)}>âŽ™ PRINT</button>
      </div>
    </div>
  );
}

function App(){
  const [screen,setScreen]=useState("landing"); // landing | sponsor | auth | game
  const [user,setUser]=useState(null);
  const [intense,setIntense]=useState(false);

  const handleRedPill=()=>{
    setIntense(true);
    setTimeout(()=>setScreen("sponsor"),100);
  };

  const handleSponsorDone=()=>{
    setScreen("auth");
    setIntense(false);
  };

  const login=(u)=>{ACTIVE_USER_ROLE=u?.role||null;setUser(u);setScreen("game")};
  const logout=()=>{ACTIVE_USER_ROLE=null;setUser(null);setScreen("auth")};

  return(
    <>
      <MatrixRain intense={intense||screen==="sponsor"}/>
      <div className="scanline-overlay"/>
      <div className="noise"/>

      {/* LANDING */}
      {screen==="landing"&&(
        <div style={{position:"relative",zIndex:1}}>
          <Landing onRedPill={handleRedPill}/>
        </div>
      )}

      {/* SPONSOR ANIMATION */}
      {screen==="sponsor"&&(
        <SponsorAnimation onComplete={handleSponsorDone}/>
      )}

      {/* AUTH / GAME */}
      {(screen==="auth"||screen==="game")&&(
        <div style={{position:"relative",zIndex:1,minHeight:"100vh"}}>
          {screen==="auth"&&<Login onLogin={login}/>}
          {screen==="game"&&user?.role==="admin"&&<Admin user={user} onLogout={logout}/>}
          {screen==="game"&&user?.role==="team"&&<ClueScreen user={user} onLogout={logout}/>}
        </div>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
